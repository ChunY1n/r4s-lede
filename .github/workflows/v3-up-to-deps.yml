name: Build Lede R4S DDR3 1GB (dae/daed + xwan)

on:
  workflow_dispatch:
    inputs:
      lede_ref:
        description: 'lede 源码引用 (默认 master)'
        required: false
        default: 'master'
      dae_ver:
        description: 'dae/daed 版本 (latest=自动)'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 2 * * 0'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      dae_ver: ${{ steps.resolve.outputs.dae_ver }}
    steps:
      - name: 解析 dae/daed 最新版本
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAE_VER="${{ github.event.inputs.dae_ver }}"
          if [ -z "$DAE_VER" ] || [ "$DAE_VER" = "latest" ]; then
            DAE_VER=$(curl -fsS --max-time 30 \
              "https://api.github.com/repos/kenzok8/openwrt-daede/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null || true)
          fi
          [ -n "$DAE_VER" ] || DAE_VER="v2026.08.05"
          echo "dae_ver=$DAE_VER" >> "$GITHUB_OUTPUT"
          echo "DAE_VER=$DAE_VER"

  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}
      DAE_VER: ${{ needs.check.outputs.dae_ver }}
      IMMWRT_TAG: '25.12.1'
      CCACHE_DIR: ${{ github.workspace }}/lede/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk \
            gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev \
            libc6-dev-i386 subversion flex uglifyjs git-core \
            gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
            libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf \
            automake libtool autopoint device-tree-compiler \
            python3 python3-pip python3-dev python3-setuptools python3-pyelftools swig \
            clang llvm jq pahole bc libdw-dev gh
          sudo -E apt-get -y autoremove --purge || true
          sudo -E apt-get clean
          df -h .

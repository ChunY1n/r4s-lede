name: Build Lede R4S DDR3 1GB (dae/daed + xwan)

on:
  workflow_dispatch:
    inputs:
      lede_ref:
        description: 'lede 源码引用 (默认 master)'
        required: false
        default: 'master'
      dae_ver:
        description: 'dae/daed 版本 (latest=自动)'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 2 * * 0'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      dae_ver: ${{ steps.resolve.outputs.dae_ver }}
    steps:
      - name: 解析 dae/daed 最新版本
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAE_VER="${{ github.event.inputs.dae_ver }}"
          if [ -z "$DAE_VER" ] || [ "$DAE_VER" = "latest" ]; then
            DAE_VER=$(curl -fsS --max-time 30 \
              "https://api.github.com/repos/kenzok8/openwrt-daede/releases/latest" \
              | jq -r '.tag_name' 2>/dev/null || true)
          fi
          [ -n "$DAE_VER" ] || DAE_VER="v2026.08.05"
          echo "dae_ver=$DAE_VER" >> "$GITHUB_OUTPUT"
          echo "DAE_VER=$DAE_VER"

  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LEDE_REF: ${{ github.event.inputs.lede_ref || 'master' }}
      DAE_VER: ${{ needs.check.outputs.dae_ver }}
      CCACHE_DIR: ${{ github.workspace }}/lede/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 3G

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo -E apt-get update
          sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk \
            gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev \
            libc6-dev-i386 subversion flex uglifyjs git-core \
            gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
            libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf \
            automake libtool autopoint device-tree-compiler \
            python3 python3-pip python3-dev python3-setuptools python3-pyelftools swig \
            clang llvm jq pahole bc libdw-dev gh
          sudo -E apt-get -y autoremove --purge || true
          sudo -E apt-get clean
          df -h .

      - name: 克隆 lede 源码
        run: |
          git clone --depth 1 --branch "$LEDE_REF" https://github.com/coolsnowwolf/lede.git
          LEDE_SHA=$(cd lede && git rev-parse --short HEAD)
          echo "LEDE_SHA=$LEDE_SHA" >> "$GITHUB_ENV"
          echo "lede 版本: $(cd lede && git log --oneline -1)"

      - name: 剔除与 dae 冲突的默认插件（turboacc / ssr-plus）
        run: |
          cd lede
          sed -i 's/ luci-app-turboacc//g; s/ luci-app-ssr-plus//g' include/target.mk
          if grep -E 'luci-app-(turboacc|ssr-plus)' include/target.mk; then
            echo "错误: 默认插件剔除失败"; exit 1
          fi
          echo "已从默认包列表移除 turboacc / ssr-plus"

      - name: 检查是否已发布
        id: check_release
        run: |
          RELEASE_TAG="r4s-lede-ddr3-${LEDE_SHA}-${DAE_VER#v}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG 已存在，跳过编译"
          fi

      - name: 复制本地包（xwan / mwan3plus / wizard / r4s-layout）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cp -r packages/* lede/package/
          ls lede/package/xwan lede/package/wizard lede/package/r4s-layout

      - name: 更新并安装 feeds
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 修复 LuCI 强制跳转设置向导的 bug
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          HDR=feeds/luci/modules/luci-base/ucode/template/header.ut
          [ -f "$HDR" ] || { echo "错误: 未找到 $HDR"; exit 1; }
          # coolsnowwolf/luci 的模板里有一段逻辑：只要 /etc/config/wizard 存在且
          # finished 标记未写入，就把所有 admin 页面强制跳去 /admin/wizard。
          # 但向导完成标记没有任何代码会写入，导致每次进 LuCI 都被强制跳转，
          # 而 /admin/wizard 在本固件里又没有注册，最终变成 404 死循环。
          # 这里直接把 wizard_pending 固定为 false，禁用强制跳转（向导仍可从菜单进入）。
          if grep -q "wizard_pending = (wizard_uci.get" "$HDR"; then
            sed -i "/wizard_pending = (wizard_uci.get/c\wizard_pending = false;" "$HDR"
          fi
          if grep -q "wizard_pending = (wizard_uci.get" "$HDR"; then
            echo "错误: LuCI 向导跳转修复未生效"; exit 1
          fi
          echo "LuCI 向导强制跳转已禁用"

      - name: 添加 daede 软件源（强制使用 kenzok8 的 dae/daed 核心）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          echo 'src-git daede https://github.com/kenzok8/openwrt-daede.git' >> feeds.conf.default
          ./scripts/feeds update daede
          ./scripts/feeds install -a

          # LEDE 自带源（coolsnowwolf/packages）里也有老版 dae/daed（0.6.0/1.27.0），
          # 不剔除会顶掉 kenzok8 的新核心。删掉 LEDE 的副本并强制从 daede 源安装。
          rm -rf package/feeds/packages/dae package/feeds/packages/daed
          ./scripts/feeds install -f -p daede dae daed
          ls package/feeds/daede/
          grep -q '^PKG_VERSION:=2026' package/feeds/daede/dae/Makefile || { echo "错误: dae 不是 kenzok8 新版"; exit 1; }
          grep -q '^PKG_VERSION:=2026' package/feeds/daede/daed/Makefile || { echo "错误: daed 不是 kenzok8 新版"; exit 1; }
          [ ! -e package/feeds/packages/dae ] && [ ! -e package/feeds/packages/daed ] || { echo "错误: LEDE 自带 dae/daed 未剔除"; exit 1; }

          # 编译后不需要这条源，避免 distfeeds 生成死链
          sed -i '/^src-git daede /d' feeds.conf.default
          sed -i '/^src-git daede /d' feeds.conf 2>/dev/null || true

      - name: 打开内核 BPF/BTF（dae/daed 必需）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          for KCFG in target/linux/generic/config-6.12 target/linux/rockchip/config-6.12 target/linux/rockchip/armv8/config-6.12; do
            [ -f "$KCFG" ] || continue
            sed -i \
              -e 's/^# CONFIG_BPF_SYSCALL is not set$/CONFIG_BPF_SYSCALL=y/' \
              -e 's/^# CONFIG_BPF_JIT is not set$/CONFIG_BPF_JIT=y/' \
              -e 's/^# CONFIG_BPF_JIT_ALWAYS_ON is not set$/CONFIG_BPF_JIT_ALWAYS_ON=y/' \
              -e 's/^# CONFIG_BPF_STREAM_PARSER is not set$/CONFIG_BPF_STREAM_PARSER=y/' \
              -e 's/^# CONFIG_BPF_EVENTS is not set$/CONFIG_BPF_EVENTS=y/' \
              -e 's/^# CONFIG_CGROUPS is not set$/CONFIG_CGROUPS=y/' \
              -e 's/^# CONFIG_KPROBES is not set$/CONFIG_KPROBES=y/' \
              -e 's/^# CONFIG_KPROBE_EVENTS is not set$/CONFIG_KPROBE_EVENTS=y/' \
              -e 's/^# CONFIG_NAMESPACES is not set$/CONFIG_NAMESPACES=y/' \
              -e 's/^# CONFIG_IPV6_MULTIPLE_TABLES is not set$/CONFIG_IPV6_MULTIPLE_TABLES=y/' \
              -e 's/^# CONFIG_CGROUP_BPF is not set$/CONFIG_CGROUP_BPF=y/' \
              -e 's/^# CONFIG_NETKIT is not set$/CONFIG_NETKIT=y/' \
              -e 's/^# CONFIG_DEBUG_INFO is not set$/CONFIG_DEBUG_INFO=y/' \
              -e 's/^# CONFIG_DEBUG_INFO_BTF is not set$/CONFIG_DEBUG_INFO_BTF=y/' \
              -e 's/^# CONFIG_NET_INGRESS is not set$/CONFIG_NET_INGRESS=y/' \
              -e 's/^# CONFIG_NET_EGRESS is not set$/CONFIG_NET_EGRESS=y/' \
              -e 's/^# CONFIG_NET_SCH_INGRESS is not set$/CONFIG_NET_SCH_INGRESS=m/' \
              -e 's/^# CONFIG_NET_CLS_BPF is not set$/CONFIG_NET_CLS_BPF=m/' \
              -e 's/^# CONFIG_NET_ACT_BPF is not set$/CONFIG_NET_ACT_BPF=m/' \
              -e 's/^# CONFIG_NET_CLS_ACT is not set$/CONFIG_NET_CLS_ACT=y/' \
              -e 's/^# CONFIG_VETH is not set$/CONFIG_VETH=m/' \
              -e 's/^# CONFIG_XDP_SOCKETS is not set$/CONFIG_XDP_SOCKETS=y/' \
              -e 's/^# CONFIG_XDP_SOCKETS_DIAG is not set$/CONFIG_XDP_SOCKETS_DIAG=m/' \
              "$KCFG"
          done
          cat >> target/linux/generic/config-6.12 <<'EOF'
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUPS=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NETKIT=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_DEBUG_INFO=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_NET_INGRESS=y
          CONFIG_NET_EGRESS=y
          CONFIG_NET_SCH_INGRESS=m
          CONFIG_NET_CLS_BPF=m
          CONFIG_NET_ACT_BPF=m
          CONFIG_NET_CLS_ACT=y
          CONFIG_VETH=m
          CONFIG_XDP_SOCKETS=y
          CONFIG_XDP_SOCKETS_DIAG=m
          EOF

      - name: 应用 YAOF 兼容优化（LRNG / WireGuard hotplug / BTF / TCP / TEO / O2 / mitigations）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          cp -f ../yaof-patches/hack-6.12/*.patch ./target/linux/generic/hack-6.12/
          cp -f ../yaof-patches/hack-6.12/lrng/*.patch ./target/linux/generic/hack-6.12/
          cp -f ../yaof-patches/pending-6.12/*.patch ./target/linux/generic/pending-6.12/
          # BBRv3（来自 QiuSimons/YAOF 25.12，backport-6.12）
          cp -f ../yaof-patches/backport-6.12/bbr3/*.patch ./target/linux/generic/backport-6.12/
          [ -f target/linux/generic/hack-6.12/696-v60-0001-LRNG-Entropy-Source-and-DRNG-Manager.patch ] || { echo "错误: LRNG 补丁缺失"; exit 1; }
          [ -f target/linux/generic/hack-6.12/950-wireguard-support-hotplug.patch ] || { echo "错误: WireGuard hotplug 补丁缺失"; exit 1; }
          [ -f target/linux/generic/backport-6.12/010-0016-net-tcp_bbr-v3-update-TCP-bbr-congestion-control-mod.patch ] || { echo "错误: BBRv3 补丁缺失"; exit 1; }
          cat >> target/linux/generic/config-6.12 <<'EOF'
          # CONFIG_RANDOM_DEFAULT_IMPL is not set
          CONFIG_LRNG=y
          CONFIG_LRNG_DEV_IF=y
          # CONFIG_LRNG_IRQ is not set
          CONFIG_LRNG_JENT=y
          CONFIG_LRNG_CPU=y
          # CONFIG_LRNG_SCHED is not set
          CONFIG_LRNG_SELFTEST=y
          # CONFIG_LRNG_SELFTEST_PANIC is not set
          EOF
          for KCFG in target/linux/generic/config-6.12 target/linux/rockchip/config-6.12 target/linux/rockchip/armv8/config-6.12; do
            [ -f "$KCFG" ] || continue
            sed -i -e 's/^CONFIG_CPU_IDLE_GOV_MENU=y$/CONFIG_CPU_IDLE_GOV_MENU=n/' \
                   -e 's/^# CONFIG_CPU_IDLE_GOV_TEO is not set$/CONFIG_CPU_IDLE_GOV_TEO=y/' "$KCFG"
            grep -qxF 'CONFIG_CPU_IDLE_GOV_TEO=y' "$KCFG" || echo 'CONFIG_CPU_IDLE_GOV_TEO=y' >> "$KCFG"
          done
          sed -i 's/Os/O2/g' include/target.mk
          grep -q -- '-O2 -pipe' include/target.mk || { echo "错误: O2 优化未生效"; exit 1; }
          grep -q 'nf_conntrack_tcp_max_retrans' package/kernel/linux/files/sysctl-nf-conntrack.conf || \
            echo "net.netfilter.nf_conntrack_tcp_max_retrans=5" >> package/kernel/linux/files/sysctl-nf-conntrack.conf
          sed -i 's,rootwait,rootwait mitigations=off,g' target/linux/rockchip/image/mmc.bootscript
          grep -q 'mitigations=off' target/linux/rockchip/image/mmc.bootscript || { echo "错误: mitigations=off 未生效"; exit 1; }
          echo "YAOF 兼容优化已应用"
      - name: 应用 YAOF 包级补丁（odhcp6c DHCPv6 hotplug）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          patch -p1 < ../yaof-patches/pkgs/odhcp6c/1002-odhcp6c-support-dhcpv6-hotplug.patch
          grep -q 'hotplug-call dhcpv6' package/network/ipv6/odhcp6c/files/dhcpv6.script || { echo "错误: odhcp6c hotplug 未生效"; exit 1; }
          echo "odhcp6c 补丁已应用"
      - name: 放宽 LuCI/rpcd 超时（30s→60s）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          sed -i 's/option timeout 30/option timeout 60/' package/system/rpcd/files/rpcd.config
          grep -q 'option timeout 60' package/system/rpcd/files/rpcd.config || { echo "错误: rpcd 超时未生效"; exit 1; }
          RPC=feeds/luci/modules/luci-base/htdocs/luci-static/resources/rpc.js
          sed -i 's/(L\.env\.rpctimeout ?? 20)/(L.env.rpctimeout ?? 60)/' "$RPC"
          grep -q 'rpctimeout ?? 60' "$RPC" || { echo "错误: LuCI rpc.js 超时未生效"; exit 1; }
          echo "LuCI/rpcd 超时已放宽到 60s"
      - name: 生成 OpenWrt 配置
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=512
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y

          CONFIG_PACKAGE_luci-app-xwan=y
          CONFIG_PACKAGE_mwan3plus=y
          CONFIG_PACKAGE_luci-app-wizard=y
          CONFIG_PACKAGE_r4s-layout=y
          CONFIG_PACKAGE_luci-app-daede=y
          CONFIG_PACKAGE_luci-app-daede_daed=y
          CONFIG_PACKAGE_daed=y
          CONFIG_PACKAGE_dae=y

          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-xdp-sockets-diag=y
          CONFIG_PACKAGE_kmod-macvlan=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-mt7601u=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-cryptodev=y
          CONFIG_PACKAGE_kmod-crypto-user=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_r8152-firmware=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-ipheth=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-pl2303=y
          CONFIG_PACKAGE_kmod-usb-serial-cp210x=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_unzip=y

          CONFIG_KERNEL_DEBUG_INFO=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          CONFIG_KERNEL_BPF_EVENTS=y
          CONFIG_KERNEL_CGROUPS=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_KPROBES=y
          CONFIG_KERNEL_KPROBE_EVENTS=y
          CONFIG_KERNEL_NAMESPACES=y
          CONFIG_KERNEL_NET_NS=y
          CONFIG_KERNEL_IPV6_MULTIPLE_TABLES=y
          CONFIG_KERNEL_XDP_SOCKETS=y
          # CONFIG_PACKAGE_kselftests-bpf is not set
          CONFIG_BPF_TOOLCHAIN_HOST=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          echo "=== defconfig 后关键项 ==="
          grep -E 'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=|CONFIG_TARGET_ROOTFS_PARTSIZE=|CONFIG_KERNEL_DEBUG_INFO_BTF=|CONFIG_KERNEL_BPF_SYSCALL=|CONFIG_KERNEL_CGROUP_BPF=|CONFIG_KERNEL_NETKIT=|CONFIG_PACKAGE_(dae|daed|luci-app-daede|luci-app-xwan|mwan3plus|luci-app-wizard|r4s-layout)=' .config || true

      - name: 配置硬校验
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          for key in \
              'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y' \
              'CONFIG_TARGET_ROOTFS_PARTSIZE=512' \
              'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
              'CONFIG_TARGET_ROOTFS_EXT4FS=y' \
              'CONFIG_KERNEL_DEBUG_INFO=y' \
              'CONFIG_KERNEL_DEBUG_INFO_BTF=y' \
              'CONFIG_KERNEL_BPF_EVENTS=y' \
              'CONFIG_KERNEL_CGROUPS=y' \
              'CONFIG_KERNEL_CGROUP_BPF=y' \
              'CONFIG_KERNEL_KPROBES=y' \
              'CONFIG_KERNEL_KPROBE_EVENTS=y' \
              'CONFIG_KERNEL_XDP_SOCKETS=y' \
              'CONFIG_KERNEL_NAMESPACES=y' \
              'CONFIG_KERNEL_NET_NS=y' \
              'CONFIG_KERNEL_IPV6_MULTIPLE_TABLES=y' \
              'CONFIG_PACKAGE_luci-app-xwan=y' \
              'CONFIG_PACKAGE_mwan3plus=y' \
              'CONFIG_PACKAGE_luci-app-wizard=y' \
              'CONFIG_PACKAGE_r4s-layout=y' \
              'CONFIG_PACKAGE_luci-app-daede=y' \
              'CONFIG_PACKAGE_dae=y' \
              'CONFIG_PACKAGE_daed=y' \
              'CONFIG_PACKAGE_kmod-mac80211=y' \
              'CONFIG_PACKAGE_kmod-mt7601u=y' \
              'CONFIG_PACKAGE_kmod-wireguard=y' \
              'CONFIG_PACKAGE_luci-proto-wireguard=y' \
              'CONFIG_PACKAGE_wireguard-tools=y' \
              'CONFIG_PACKAGE_kmod-cryptodev=y' \
              'CONFIG_PACKAGE_kmod-crypto-user=y' \
              'CONFIG_PACKAGE_kmod-usb-net-rtl8152=y' \
              'CONFIG_PACKAGE_r8152-firmware=y' \
              'CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y' \
              'CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' \
              'CONFIG_PACKAGE_kmod-usb-net-rndis=y' \
              'CONFIG_PACKAGE_kmod-usb-storage=y' \
              'CONFIG_PACKAGE_kmod-usb-serial=y' \
              'CONFIG_PACKAGE_kmod-usb3=y' \
              'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' \
              'CONFIG_PACKAGE_usb-modeswitch=y' \
              'CONFIG_PACKAGE_kmod-tcp-bbr=y'; do
            grep -qxF "$key" .config || { echo "错误: 缺少 $key"; exit 1; }
          done
          grep -qxF 'CONFIG_BPF_TOOLCHAIN_HOST=y' .config || { echo "错误: BPF 工具链未使用系统 clang (BPF_TOOLCHAIN_HOST)"; exit 1; }
          grep -qE '^CONFIG_FEED_daede(=y|=m)$' .config && { echo "错误: CONFIG_FEED_daede 仍启用，distfeeds 会生成死链"; exit 1; }
          grep -qxF '# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set' .config || { echo "错误: DEBUG_INFO_REDUCED 未关闭"; exit 1; }
          grep -qE '^CONFIG_PACKAGE_kselftests-bpf=y' .config && { echo "错误: kselftests-bpf 被选中（BTF 自动勾选）"; exit 1; }
          grep -qE '^CONFIG_PACKAGE_fw4=y|^CONFIG_PACKAGE_nftables=y' .config && { echo "错误: fw4/nftables 被选中，违背单防火墙原则"; exit 1; }
          grep -qE '^CONFIG_PACKAGE_luci-app-(turboacc|ssr-plus)=[ym]' .config && { echo "错误: turboacc/ssr-plus 仍被选中"; exit 1; }
          grep -qxF 'CONFIG_BPF_SYSCALL=y' target/linux/generic/config-6.12 || { echo "错误: 内核配置文件缺少 CONFIG_BPF_SYSCALL=y"; exit 1; }
          grep -qxF 'CONFIG_DEBUG_INFO_BTF=y' target/linux/generic/config-6.12 || { echo "错误: 内核配置文件缺少 CONFIG_DEBUG_INFO_BTF=y"; exit 1; }
          grep -qxF 'CONFIG_NETKIT=y' target/linux/generic/config-6.12 || { echo "错误: 内核配置文件缺少 CONFIG_NETKIT=y"; exit 1; }
          grep -qxF 'CONFIG_VETH=m' target/linux/generic/config-6.12 || { echo "错误: 内核配置文件缺少 CONFIG_VETH=m"; exit 1; }
          grep -qxF 'CONFIG_LRNG=y' target/linux/generic/config-6.12 || { echo "错误: 内核配置文件缺少 CONFIG_LRNG=y"; exit 1; }
          grep -qxF 'CONFIG_CPU_IDLE_GOV_TEO=y' target/linux/generic/config-6.12 || { echo "错误: 内核配置文件缺少 CONFIG_CPU_IDLE_GOV_TEO=y"; exit 1; }
          echo "配置校验通过"

      - name: 恢复工具链缓存
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            lede/staging_dir/toolchain-*
            lede/staging_dir/host
          key: lede-toolchain-v1-${{ env.LEDE_SHA }}-rockchip-armv8
          restore-keys: |
            lede-toolchain-v1-

      - name: 恢复 ccache
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: lede/.ccache
          key: lede-ccache-v1-${{ env.LEDE_SHA }}-rockchip-armv8
          restore-keys: |
            lede-ccache-v1-

      - name: 编译固件
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          cp ../build.sh .
          chmod +x build.sh
          ./build.sh "$(nproc)"

      - name: 验证内核 BTF/BPF 实际生效
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          KCFG=$(find build_dir -type f -name .config -path '*linux-6.12*' 2>/dev/null | head -1)
          [ -n "$KCFG" ] || { echo "错误: 未找到内核 .config"; exit 1; }
          echo "内核配置: $KCFG"
          for key in \
              'CONFIG_BPF_SYSCALL=y' \
              'CONFIG_BPF_JIT=y' \
              'CONFIG_DEBUG_INFO=y' \
              'CONFIG_DEBUG_INFO_BTF=y' \
              'CONFIG_CGROUPS=y' \
              'CONFIG_CGROUP_BPF=y' \
              'CONFIG_NETKIT=y' \
              'CONFIG_VETH=m' \
              'CONFIG_NET_CLS_BPF=m' \
              'CONFIG_NET_ACT_BPF=m' \
              'CONFIG_NET_CLS_ACT=y' \
              'CONFIG_NET_SCH_INGRESS=m' \
              'CONFIG_KPROBES=y' \
              'CONFIG_BPF_EVENTS=y' \
              'CONFIG_NAMESPACES=y' \
              'CONFIG_NET_NS=y' \
              'CONFIG_IPV6_MULTIPLE_TABLES=y' \
              'CONFIG_XDP_SOCKETS=y' \
              'CONFIG_XDP_SOCKETS_DIAG=m'; do
            grep -qxF "$key" "$KCFG" || { echo "错误: 内核缺少 $key"; exit 1; }
          done
          grep -qE '^CONFIG_TCP_CONG_BBR=(y|m)$' "$KCFG" || { echo "错误: 内核缺少 TCP_CONG_BBR (BBRv3)"; exit 1; }
          echo "内核配置验证通过"
          echo "=== daede 核心版本验证 ==="
          MF=$(find bin/targets/rockchip/armv8 -name '*.manifest' 2>/dev/null | head -1)
          [ -n "$MF" ] || { echo "错误: 未找到固件 manifest"; exit 1; }
          grep -E '^(dae|daed) - 2026\.' "$MF" || { echo "错误: 固件未包含 kenzok8 新版 dae/daed"; exit 1; }
          grep -qE '^kmod-tcp-bbr - ' "$MF" || { echo "错误: 固件未包含 kmod-tcp-bbr (BBRv3)"; exit 1; }
          echo "daede 核心版本验证通过"

      - name: 保存工具链缓存
        if: steps.check_release.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            lede/staging_dir/toolchain-*
            lede/staging_dir/host
          key: lede-toolchain-v1-${{ env.LEDE_SHA }}-rockchip-armv8

      - name: 保存 ccache
        if: steps.check_release.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: lede/.ccache
          key: lede-ccache-v1-${{ env.LEDE_SHA }}-rockchip-armv8

      - name: 收集固件镜像
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          rm -f ../firmware_paths.txt
          find_r4s() {
            find bin/targets/rockchip/armv8/ \
              -name "*nanopi-r4s*$1*sysupgrade*.img*" \
              ! -name "*enterprise*" 2>/dev/null | head -1
          }
          SQ_IMG=$(find_r4s squashfs)
          EXT4_IMG=$(find_r4s ext4)
          if [ -z "$SQ_IMG" ] && [ -z "$EXT4_IMG" ]; then
            echo "未找到 R4S 镜像"; ls -la bin/targets/rockchip/armv8/; exit 1
          fi
          for IMG in "$SQ_IMG" "$EXT4_IMG"; do
            [ -n "$IMG" ] || continue
            if [[ "$IMG" == *.gz ]]; then
              gzip -dc "$IMG" > "${IMG%.gz}" || rc=$?
              if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 2 ]; then
                echo "解压失败"; exit 1
              fi
              rm -f "$IMG"
              IMG="${IMG%.gz}"
            fi
            echo "$(pwd)/$IMG" >> ../firmware_paths.txt
          done
          cat ../firmware_paths.txt

      - name: 校验镜像分区（rootfs = 512MiB）
        if: steps.check_release.outputs.skip != 'true'
        run: |
          cd lede
          while IFS= read -r IMG; do
            [ -n "$IMG" ] || continue
            echo "校验: $IMG"
            python3 - "$IMG" <<'PYEOF'
          import os, struct, sys
          img = sys.argv[1]
          with open(img, 'rb') as f:
              mbr = f.read(512)
          assert mbr[510:512] == b'\x55\xaa', 'MBR signature'
          parts = []
          for i in range(4):
              e = mbr[446 + i*16 : 446 + (i+1)*16]
              if e[4] == 0 and e[8:12] == b'\x00'*4:
                  continue
              start = struct.unpack_from('<I', e, 8)[0]
              size = struct.unpack_from('<I', e, 12)[0]
              parts.append((start, size))
          print('partitions:', parts)
          assert len(parts) == 2, 'expected 2 partitions, got %d' % len(parts)
          assert parts[1][1] == 1048576, 'rootfs partition should be 512MiB'
          print('OK')
          PYEOF
          done < ../firmware_paths.txt

      - name: 压缩并生成说明
        if: steps.check_release.outputs.skip != 'true'
        run: |
          OUTPUT_DIR="firmware"
          mkdir -p "$OUTPUT_DIR"
          while IFS= read -r IMG_FULL; do
            [ -n "$IMG_FULL" ] || continue
            BASE=$(basename "$IMG_FULL")
            VARIANT_TYPE=$(echo "$BASE" | grep -oE '(squashfs|ext4)' | head -1)
            [ -n "$VARIANT_TYPE" ] || VARIANT_TYPE="img"
            gzip -c "$IMG_FULL" > "$OUTPUT_DIR/r4s-lede-ddr3-${VARIANT_TYPE}-${LEDE_SHA}-${DAE_VER#v}.img.gz"
            sha256sum "$IMG_FULL" > "$OUTPUT_DIR/r4s-lede-ddr3-${VARIANT_TYPE}-${LEDE_SHA}-${DAE_VER#v}.sha256"
          done < firmware_paths.txt
          {
            echo "Lede for NanoPi R4S DDR3 1GB (dae/daed + xwan)"
            echo '=================================================='
            echo ''
            echo "lede  : $LEDE_SHA"
            echo "dae   : $DAE_VER"
            echo "U-Boot: lede 自带 rk3399_ddr_800MHz_v1.30.bin（原生支持 DDR3 1GB）"
            echo "Built : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ''
            echo 'Includes'
            echo '--------'
            echo '- luci-app-xwan + mwan3plus（iptables 单线多拨）'
            echo '- dae / daed / luci-app-daede（内核 BTF + netkit）'
            echo '- luci-app-wizard（初始化向导，仅保留有效选项：上网/LAN/IPv6/可选内核模块）'
            echo '- USB 网卡驱动：RTL8152/8153、AX88179、CDC、RNDIS、4G 模块'
            echo '- USB 无线：mac80211 框架 + MT7601U 驱动（照 xwrt）'
            echo '- WireGuard（内核 + LuCI 协议 + 工具）'
            echo '- Cryptodev & AF_ALG'
            echo '- 分区：系统 rootfs 512MB + 软件 overlay 1024MB（首启自动创建）'
            echo '- 后台地址：http://192.168.15.1'
            echo '- 防火墙：仅 iptables/fw3，无 nftables/fw4'
            echo ''
            echo 'Files'
            echo '-----'
            echo "- squashfs: r4s-lede-ddr3-squashfs-${LEDE_SHA}-${DAE_VER#v}.img.gz"
            echo "- ext4    : r4s-lede-ddr3-ext4-${LEDE_SHA}-${DAE_VER#v}.img.gz"
          } > "$OUTPUT_DIR/README.txt"
          ls -lh "$OUTPUT_DIR/"

      - name: 上传固件
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r4s-lede-firmware
          path: firmware/
          retention-days: 30

      - name: 发布到 GitHub Release
        if: steps.check_release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd firmware
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖资产"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lede R4S DDR3 1GB Firmware (dae/daed + xwan) $LEDE_SHA" \
              --notes "lede=$LEDE_SHA · dae=$DAE_VER · U-Boot lede 原生 DDR3" \
              *.img.gz *.sha256 README.txt || true
          fi
          gh release upload "$RELEASE_TAG" *.img.gz *.sha256 README.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
